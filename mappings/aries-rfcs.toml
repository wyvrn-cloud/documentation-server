# --- Documents ----------------------------------------------------------------------------

# DIDComm v1 has no single specification; these RFCs are what defines it. Served as
# version 1.0 of the "spec" document, in reading order. Section ids are prefixed with
# the RFC number (rfc0008-..., and rfc0008 for the RFC as a whole).
[[document]]
id = "spec"
version = "1.0"
title = "DIDComm Messaging v1 (Aries RFCs)"
didcomm_versions = ["^1.0"]
rfcs = [
  "concepts/0005-didcomm",
  "concepts/0021-didcomm-message-anatomy",
  "concepts/0020-message-types",
  "features/0348-transition-msg-type-to-https",
  "concepts/0003-protocols",
  "concepts/0008-message-id-and-threading",
  "concepts/0011-decorators",
  "concepts/0017-attachments",
  "features/0019-encryption-envelope",
  "features/0587-encryption-envelope-v2",
  "features/0044-didcomm-file-and-mime-types",
  "features/0025-didcomm-transports",
  "features/0092-transport-return-route",
  "concepts/0046-mediators-and-relays",
  "concepts/0094-cross-domain-messaging",
  "features/0067-didcomm-diddoc-conventions",
  "features/0360-use-did-key",
  "features/0793-unqualfied-dids-transition",
  "features/0056-service-decorator",
  "features/0043-l10n",
  "features/0032-message-timing",
  "features/0015-acks",
  "features/0035-report-problem",
  "features/0034-message-tracing",
  "features/0234-signature-decorator",
  "features/0066-non-repudiable-cryptographic-envelope",
  "concepts/0519-goal-codes",
  "features/0496-transition-to-oob-and-did-exchange",
  "concepts/0302-aries-interop-profile",
  "concepts/0074-didcomm-best-practices",
  "concepts/0047-json-ld-compatibility",
  "concepts/0049-repudiation",
]

# The attachment formats issue-credential/2.0 and present-proof/2.0 carry credentials,
# requests and proofs in.
[[document]]
id = "aries/attachment-formats"
version = "current"
title = "Aries Credential Attachment Formats"
didcomm_versions = ["^1.0"]
rfcs = [
  "features/0592-indy-attachments",
  "features/0771-anoncreds-attachments",
  "features/0593-json-ld-cred-attach",
  "features/0809-w3c-data-integrity-credential-attachment",
  "features/0881-w3c-vc-sd-jwt-credential-attachment",
  "features/0646-bbs-credentials",
  "features/0510-dif-pres-exch-attach",
  "features/0511-dif-cred-manifest-attach",
  "features/0641-linking-binary-objects-to-credentials",
  "features/0728-device-binding-attachments",
  "features/0780-data-urls-images",
]

# RFCs with example messages that are deliberately not indexed, with why.
[ignore]
rfcs = [
  # Defined on didcomm.org with both v1 and v2 examples; that page is indexed.
  "features/0113-question-answer",
  "features/0557-discover-features-v2",
  # Extensions of present-proof/1.0 and issue-credential/1.0, not protocols of their own.
  "features/0347-proof-negotiation",
  "features/0075-payment-decorators",
  # Examples of other protocols' messages; no protocol of their own.
  "features/0351-purpose-decorator",
  "features/0281-rich-schemas",
  "features/0327-crypto-service",
  "concepts/0346-didcomm-between-two-mobile-agents",
  "concepts/0700-oob-through-redirect",
  "concepts/0812-compression-dictionary",
]

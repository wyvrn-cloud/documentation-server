# What the server reads from hyperledger/aries-rfcs (sources/aries-rfcs), which defines
# most DIDComm v1 protocols. RFCs have no frontmatter naming their PIURI, so this file
# does: one [[protocol]] per PIURI, and [[document]]s compiled from RFCs that define
# conventions rather than protocols.
#
# A protocol replaces a didcomm.org page for the same PIURI that only links to the RFC
# (one with no example messages); anywhere else, two sources defining one PIURI is a
# warning. tests/index.rs fails if an RFC with example messages is neither used here
# nor listed under [ignore], so new upstream RFCs can't slip past unnoticed.
#
# [[protocol]] keys:
#   piuri       the PIURI the protocol is indexed under
#   rfc         the RFC folder
#   substitute  optional: replacements applied to example message types before they're
#               grouped, for RFCs that write a placeholder (%VER, <baseuri>) or show
#               one version's types while defining another. Examples are still served
#               as written.
#   aliases     optional: other PIURIs for the same protocol

# --- Adopted / Accepted -----------------------------------------------------------

[[protocol]]
piuri = "https://didcomm.org/notification/1.0"
rfc = "features/0015-acks"

[[protocol]]
piuri = "https://didcomm.org/didexchange/1.1"
rfc = "features/0023-did-exchange"

# The same RFC defines 1.0; 1.1 only added the optional goal/goal_code on request.
[[protocol]]
piuri = "https://didcomm.org/didexchange/1.0"
rfc = "features/0023-did-exchange"
substitute = { "https://didcomm.org/didexchange/1.1/" = "https://didcomm.org/didexchange/1.0/" }

[[protocol]]
piuri = "https://didcomm.org/discover-features/1.0"
rfc = "features/0031-discover-features"

[[protocol]]
piuri = "https://didcomm.org/report-problem/1.0"
rfc = "features/0035-report-problem"

[[protocol]]
piuri = "https://didcomm.org/issue-credential/1.0"
rfc = "features/0036-issue-credential"

# 1.1 added optional fields to propose-credential; the RFC defines both.
[[protocol]]
piuri = "https://didcomm.org/issue-credential/1.1"
rfc = "features/0036-issue-credential"
substitute = { "https://didcomm.org/issue-credential/1.0/" = "https://didcomm.org/issue-credential/1.1/" }

[[protocol]]
piuri = "https://didcomm.org/present-proof/1.0"
rfc = "features/0037-present-proof"

[[protocol]]
piuri = "https://didcomm.org/trust_ping/1.0"
rfc = "features/0048-trust-ping"
aliases = ["https://didcomm.org/trust-ping/1.0"]

[[protocol]]
piuri = "https://didcomm.org/basicmessage/1.0"
rfc = "features/0095-basic-message"

[[protocol]]
piuri = "https://didcomm.org/connections/1.0"
rfc = "features/0160-connection-protocol"

[[protocol]]
piuri = "https://didcomm.org/revocation_notification/1.0"
rfc = "features/0183-revocation-notification"

[[protocol]]
piuri = "https://didcomm.org/coordinate-mediation/1.0"
rfc = "features/0211-route-coordination"
substitute = { "<baseuri>" = "https://didcomm.org/coordinate-mediation/1.0" }

[[protocol]]
piuri = "https://didcomm.org/out-of-band/1.1"
rfc = "features/0434-outofband"
substitute = { "%VER" = "1.1" }

[[protocol]]
piuri = "https://didcomm.org/issue-credential/2.0"
rfc = "features/0453-issue-credential-v2"
substitute = { "%VER" = "2.0" }

[[protocol]]
piuri = "https://didcomm.org/present-proof/2.0"
rfc = "features/0454-present-proof-v2"
substitute = { "%VER" = "2.0" }

[[protocol]]
piuri = "https://didcomm.org/messagepickup/2.0"
rfc = "features/0685-pickup-v2"

# The RFC's examples say 2.1, but it defines 2.0, which is what implementations send.
[[protocol]]
piuri = "https://didcomm.org/revocation_notification/2.0"
rfc = "features/0721-revocation-notification-v2"
substitute = { "https://didcomm.org/revocation_notification/2.1/" = "https://didcomm.org/revocation_notification/2.0/" }

[[protocol]]
piuri = "https://didcomm.org/did-rotate/1.0"
rfc = "features/0794-did-rotate"


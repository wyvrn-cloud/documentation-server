id = "hlindy/cred-filter@v2.0"
title = "Indy credential filter"
document = "aries/attachment-formats"
section = "rfc0592"
[[format.use]]
message = "propose-credential"
protocols = ["https://didcomm.org/issue-credential/2.0"]

